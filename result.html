<!-- ⚡️ สมองคำนวณนับจำนวนพนักงานรายคนอัตโนมัติ -->
<script>
    // ฟังก์ชันช่วยนับจำนวนสเตชั่นที่ผ่านของพนักงานแต่ละคนค๊าา
    function updateStationPassSummary(searchResultsData) {
        if (!searchResultsData || !Array.isArray(searchResultsData)) return;

        // Map สำหรับรวมนับว่าพนักงาน 1 คนผ่านไปกี่สเตชั่นแล้ว
        const empPassedMap = {};

        searchResultsData.forEach(item => {
            const empName = item.name || item.empId || item.employee;
            const isPass = item.status === 'ผ่าน' || item.status === 'Pass';

            if (empName && isPass) {
                empPassedMap[empName] = (empPassedMap[empName] || 0) + 1;
            }
        });

        // ตัวแปรนับจำนวนคนผ่าน 1, 2, 3, 4 สเตชั่น
        let p1 = 0, p2 = 0, p3 = 0, p4 = 0;

        Object.values(empPassedMap).forEach(count => {
            if (count === 1) p1++;
            else if (count === 2) p2++;
            else if (count === 3) p3++;
            else if (count >= 4) p4++;
        });

        // ส่งตัวเลขที่คำนวณได้ไปแสดงผลบนการ์ดค๊าา
        if(document.getElementById('pass1')) document.getElementById('pass1').textContent = p1;
        if(document.getElementById('pass2')) document.getElementById('pass2').textContent = p2;
        if(document.getElementById('pass3')) document.getElementById('pass3').textContent = p3;
        if(document.getElementById('pass4')) document.getElementById('pass4').textContent = p4;
    }
</script>
